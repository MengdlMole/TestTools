<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Local API Test Tools</title>
  <style>
    :root { color-scheme: light dark; font-family: ui-monospace,SFMono-Regular,Menlo,monospace; }
    body { max-width: 1250px; margin: 28px auto; padding: 0 18px; }
    header,.toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .grid { display:grid; grid-template-columns:320px 1fr; gap:18px; margin-top:20px; }
    .panel { border:1px solid #8885; border-radius:10px; padding:14px; }
    .item { display:flex; align-items:center; gap:5px; margin:6px 0; }
    .item span { flex:1; overflow:hidden; text-overflow:ellipsis; }
    button,input { padding:7px 10px; }
    button { cursor:pointer; }
    textarea { box-sizing:border-box; width:100%; min-height:480px; padding:12px; font:inherit; tab-size:2; }
    pre { white-space:pre-wrap; overflow-wrap:anywhere; min-height:240px; }
    .muted { opacity:.65; } .ok { color:#24a148; } .fail { color:#da1e28; }
    .hidden { display:none; }
    @media(max-width:800px){ .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
<header>
  <div><h1>Local API Test Tools</h1><div class="muted">自动化用例 · 文件持久化 · 多签名策略 · 本地 Mock</div></div>
  <button onclick="load()">刷新</button>
</header>
<main class="grid">
  <aside class="panel">
    <div class="toolbar"><h2>测试用例</h2><button onclick="newCase()">新建</button></div>
    <div id="cases">加载中...</div>
    <button onclick="runAll()">运行全部</button>
    <h2>测试套件</h2>
    <div id="suites"></div>
    <h2>最近结果</h2>
    <div id="results" class="muted"></div>
    <h2>安全处理器</h2>
    <div id="handlers" class="muted"></div>
    <h2>Mock</h2>
    <button onclick="calls()">最近请求</button>
  </aside>
  <section class="panel">
    <div id="editor-view" class="hidden">
      <div class="toolbar">
        <div><strong>用例文件：</strong><input id="case-name" pattern="[a-zA-Z0-9_-]+"></div>
        <div><button onclick="saveCase()">保存</button><button onclick="closeEditor()">关闭</button></div>
      </div>
      <p class="muted">YAML 保存后立即生效；文件位于 test-workspace/cases。</p>
      <textarea id="case-yaml" spellcheck="false"></textarea>
    </div>
    <div id="result-view">
      <h2 id="result-title">执行结果</h2>
      <pre id="result" class="muted">选择左侧用例或套件执行。</pre>
    </div>
  </section>
</main>
<script>
let state = {};
async function request(url, options) {
  const response = await fetch(url, options);
  const text = await response.text();
  if (!response.ok) throw new Error(text);
  const type = response.headers.get('content-type') || '';
  return type.includes('json') ? JSON.parse(text) : text;
}
async function load() {
  try {
    state = await request('/api/workspace');
    document.querySelector('#handlers').textContent = state.securityHandlers.join(', ');
    document.querySelector('#cases').innerHTML = state.cases.map(caseItem =>
      '<div class="item"><span>' + caseItem + '</span>' +
      '<button onclick="runCase(&quot;' + caseItem + '&quot;)">运行</button>' +
      '<button onclick="editCase(&quot;' + caseItem + '&quot;)">编辑</button></div>').join('') || '没有用例';
    document.querySelector('#suites').innerHTML = state.suites.map(suite =>
      '<div class="item"><span>' + suite + '</span>' +
      '<button onclick="runSuite(&quot;' + suite + '&quot;)">运行</button></div>').join('') || '没有套件';
    await loadResults();
  } catch (error) { showError(error); }
}
async function runCase(name) { await execute('/api/cases/' + encodeURIComponent(name) + '/run', name); }
async function runSuite(name) { await execute('/api/suites/' + encodeURIComponent(name) + '/run', name); }
async function runAll() { await execute('/api/cases/run-all', '全部用例'); }
async function execute(url, name) {
  show('正在执行 ' + name + ' ...');
  try {
    const data = await request(url, {method:'POST'});
    const success = data.result.success;
    document.querySelector('#result-title').innerHTML =
      '执行结果 <span class="' + (success ? 'ok' : 'fail') + '">' + (success ? 'PASS' : 'FAIL') + '</span>';
    show(JSON.stringify(data, null, 2));
    await loadResults();
  } catch (error) { showError(error); }
}
async function editCase(name) {
  try {
    document.querySelector('#case-name').value = name;
    document.querySelector('#case-yaml').value = await request('/api/cases/' + encodeURIComponent(name));
    document.querySelector('#result-view').classList.add('hidden');
    document.querySelector('#editor-view').classList.remove('hidden');
  } catch (error) { showError(error); }
}
function newCase() {
  document.querySelector('#case-name').value = 'new-case';
  document.querySelector('#case-yaml').value =
    'name: 新用例\nenvironment: local\n\nsteps:\n  - name: 健康检查\n    method: GET\n    path: /health\n    assertions:\n      - type: status\n        expected: 200\n';
  document.querySelector('#result-view').classList.add('hidden');
  document.querySelector('#editor-view').classList.remove('hidden');
}
async function saveCase() {
  const name = document.querySelector('#case-name').value;
  if (!/^[a-zA-Z0-9_-]+$/.test(name)) return alert('文件名只能包含字母、数字、下划线和中划线');
  try {
    await request('/api/cases/' + encodeURIComponent(name), {
      method:'PUT', headers:{'Content-Type':'text/yaml'}, body:document.querySelector('#case-yaml').value
    });
    alert('已保存');
    await load();
  } catch (error) { alert(error.message); }
}
function closeEditor() {
  document.querySelector('#editor-view').classList.add('hidden');
  document.querySelector('#result-view').classList.remove('hidden');
}
async function loadResults() {
  const files = await request('/api/results?limit=8');
  document.querySelector('#results').innerHTML = files.map(file =>
    '<div><button onclick="viewResult(&quot;' + file + '&quot;)">' + file.split('/').pop() + '</button></div>').join('') || '暂无结果';
}
async function viewResult(path) {
  try { show(JSON.stringify(await request('/api/result?path=' + encodeURIComponent(path)), null, 2)); }
  catch (error) { showError(error); }
}
async function calls() {
  try { show(JSON.stringify(await request('/api/mocks/calls'), null, 2)); }
  catch (error) { showError(error); }
}
function show(value) {
  closeEditor();
  document.querySelector('#result').className = '';
  document.querySelector('#result').textContent = value;
}
function showError(error) {
  document.querySelector('#result-title').innerHTML = '<span class="fail">错误</span>';
  show(error.message);
}
load();
</script>
</body>
</html>
